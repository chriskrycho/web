services:
  - type: web
    name: v6.chriskrycho.com
    runtime: static
    autoDeploy: true
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: 'true'
    buildFilter:
      paths:
        - site/public/**
    staticPublishPath: './site/public'
    domain: v6.chriskrycho.com

  - type: web
    name: music
    runtime: static
    autoDeployTrigger: 'checksPass'
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: 'true'
    buildFilter:
      paths:
        - sites/music/**
        - _scripts/**
        - Cargo.toml
        - Cargo.lock
        - rust-toolchain.toml
        - lx/Cargo.toml
        - lx/src/**
        - lx/crates/**
    buildCommand: |
      bash ./_scripts/build.sh music

    staticPublishPath: './sites/music/public'
    domain: music.chriskrycho.com
